api_platform:
    title: 'Hello API Platform'
    version: 1.0.0
    formats:
        jsonhal:
            - application/hal+json
        json:
            - application/json
        jsonld:
            - application/ld+json
    enable_swagger_ui: true
    enable_re_doc: false
    enable_scalar: false
    defaults:
        stateless: true
        # Clients can set the page size with ?itemsPerPage=
        pagination_client_items_per_page: true
        pagination_maximum_items_per_page: 100
        cache_headers:
            vary: [Content-Type, Authorization, Origin]

    oauth:
        enabled: true
        type: oauth2
        flow: authorizationCode

        clientId: '%env(OAUTH2_CLIENT_ID)%'

        authorizationUrl: 'https://auth.meunier.ovh/oauth/authorize'
        tokenUrl: 'http://192.168.50.12:8000/oauth/token'

        scopes:
            #account_connection:read: 'Read Account connections'
            account_connection:write: 'Write Account connections'
            #account:read: 'Read Account'
            account:write: 'Write Account'
            #category:read: 'Read Category'
            category:write: 'Write Category'
            #budget:read: 'Read Budget'
            budget:write: 'Write Budget'
